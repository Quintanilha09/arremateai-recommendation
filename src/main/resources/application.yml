# Server
server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: arremateai-recommendation

  # Database (Database-per-Service, ADR-009)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:recommendation_db}
    username: ${DB_USERNAME:arremateai}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_recommendation
    baseline-on-migrate: true
    baseline-version: 0

# Gateway shared secret (ADR-001) — compartilhado com gateway e demais downstream services
# Comparado contra header X-Gateway-Auth em requisicoes nao-publicas (GatewayAuthFilter, E30-H2)
# Fail-secure: ausente -> requisicoes retornam 503
app:
  gateway:
    secret: ${GATEWAY_SHARED_SECRET:}
  # Cache local Caffeine das recomendacoes heuristicas (E30-H3, ADR-009 Fase 1)
  cache:
    recomendacoes:
      ttl-segundos: ${RECOMENDACOES_CACHE_TTL_SEGUNDOS:90}

# Servicos externos consumidos via HTTP (E30-H3): o recommendation nao possui os
# dados do catalogo de lotes — so os eventos de comportamento — entao a heuristica
# content-based depende do property-catalog para reidratar categoria/uf/preco/etc.
services:
  property-catalog:
    url: ${PROPERTY_CATALOG_URL:http://localhost:8082}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api/recomendacoes/v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    path: /api/recomendacoes/swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:false}

---
# Graceful Shutdown + Liveness/Readiness Probes (padrao do projeto, E9)
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

---
# Observabilidade — metricas Prometheus + health groups (padrao do projeto, E4)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5, 0.95, 0.99
  endpoint:
    health:
      group:
        readiness:
          show-details: always
          include: readinessState,db,diskSpace
