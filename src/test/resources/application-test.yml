# Profile de testes de integracao
server:
  port: 0

spring:
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_recommendation
    baseline-on-migrate: true
    baseline-version: 0

# Secret fixo de teste para o GatewayAuthFilter (E30-H2)
app:
  gateway:
    secret: teste-gateway-secret-e30h2
  cache:
    recomendacoes:
      ttl-segundos: 90

# Host inexistente de proposito (E30-H3): os testes de integracao mockam o
# property-catalog via MockRestServiceServer — se algum teste vazar uma chamada
# real, ela falha alto e claro em vez de silenciosamente acertar um servico real.
services:
  property-catalog:
    url: http://property-catalog.invalid.test

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    root: WARN
    com.arremateai: INFO
    org.testcontainers: INFO
